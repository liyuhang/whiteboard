<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>局域网互动白板 - 教师端</title><link rel="stylesheet" href="/style.css">
</head>
<body data-role="teacher">
<header><h1>局域网互动白板 · 教师端</h1><span class="status" id="status">未连接</span></header>
<main>
  <section class="panel" id="setup">
    <h3>创建白板房间</h3>
    <p class="notice">输入部署时设置的 TEACHER_SECRET。创建后将获得房间号，学生扫码或输入房间号加入。</p>
    <div class="toolbar">
      <input id="secret" type="password" placeholder="教师管理密钥" autocomplete="off">
      <input id="teacherName" placeholder="教师名称" value="教师">
      <button class="primary" id="createRoom">创建房间</button>
    </div>
  </section>
  <section class="panel hidden" id="workspace">
    <div class="info"><span>房间号：<b id="roomLabel"></b></span><span>连接：<b id="connection">离线</b></span><span>在线人数：<b id="participants">1</b></span><span id="permission">学生绘画：已开启</span></div>
    <p class="notice">学生加入地址：<span id="studentLink"></span></p>
    <div class="toolbar">
      <label>颜色 <input type="color" id="color" value="#e53935"></label>
      <label>粗细 <input type="range" id="width" min="1" max="18" value="4"></label>
      <button id="toggleDrawing">开启/关闭学生绘画</button>
      <button id="undo">撤销最后一笔</button>
      <button id="clear">清空白板</button>
      <button id="copyLink">复制学生链接</button>
    </div>
  </section>
  <section class="canvas-wrap hidden" id="canvasWrap"><canvas id="board" width="1200" height="800"></canvas></section>
</main>
<script src="/app.js"></script>
</body></html>
